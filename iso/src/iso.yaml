# Read by Titanoboa to build the ISO's GRUB menu.
# The label is the ISO volume ID (max 32 characters) and must match CDLABEL below.
label: "BLUEBUILD-LIVE"
grub2:
  timeout: 10
  entries:
    - name: "BlueBuild Live ISO"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=BLUEBUILD-LIVE enforcing=0 rd.live.image inst.profile=bluebuild"
      initrd: "/images/pxeboot/initrd.img"
    - name: "BlueBuild Live ISO (Safe Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=BLUEBUILD-LIVE enforcing=0 rd.live.image inst.profile=bluebuild nomodeset"
      initrd: "/images/pxeboot/initrd.img"